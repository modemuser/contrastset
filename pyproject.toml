[project]
name = "contrastset"
version = "0.1.0"
description = "Build and check contrast sets (matched stimulus pairs) for interpretability experiments on local LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Misera" }]
keywords = ["interpretability", "llm", "contrast sets", "probing", "datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core: grade/generate/check against Ollama or any OpenAI-compatible server (httpx), no torch.
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/modemuser/contrastset"
Repository = "https://github.com/modemuser/contrastset"

[project.scripts]
contrastset = "contrastset.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.3.0",
]
hf = [
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "types-pyyaml", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to a real model server; skipped unless CONTRASTSET_LIVE_* env vars are set"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.ruff]
line-length = 130
# scripts/ are the research scripts behind FINDINGS.md, kept exactly as they were run
extend-exclude = ["runs", "scripts"]

[tool.ruff.lint]
# ruff's long-standing defaults (pyflakes + pycodestyle errors), pinned so a newer ruff
# does not change what "lint passes" means
select = ["E4", "E7", "E9", "F"]
